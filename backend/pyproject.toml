[project]
name = "polis-backend"
version = "0.1.0"
description = "API modular de POLIS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "bcrypt>=4.0",
  "email-validator>=2.3.0",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.20.0",
  "httpx>=0.28.1",
  "ijson>=3.6.0",
  "langgraph>=1.2.12",
  "openpyxl>=3.1.5",
  "passlib[bcrypt]>=1.7.4",
  "pillow>=12.3.0",
  "pydantic-ai>=2.52.0",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.8.0",
  "pyproj>=3.8.0",
  "python-multipart>=0.0.32",
  "qrcode[pil]>=8.2",
  "reportlab>=5.0.1",
  "shapely>=2.1.2",
  "scipy>=1.14.0,<2",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "uvicorn[standard]>=0.35,<1",
  "xlrd>=2.0.2",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requiere una base PostgreSQL/PostGIS exclusiva de pruebas"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E501"]

