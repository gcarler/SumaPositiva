name: Checks

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run ui:policy:test
      - run: bun run build
      - run: bun run storybook:build
      - run: bunx playwright install --with-deps chromium
      - run: bun run ui:test
      - uses: actions/upload-artifact@v4
        with:
          name: polis-storybook
          path: storybook-static

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: polis_test
          POSTGRES_USER: polis
          POSTGRES_PASSWORD: polis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polis -d polis_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POLIS_TEST_DATABASE_URL: postgresql+asyncpg://polis:polis_test@127.0.0.1:5432/polis_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project backend --python 3.12 --locked
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend ruff format --check backend
      - run: uv run --project backend pytest backend/tests
