# ==============================================================================
# POLIS - Configuración de Content-Security-Policy (CSP) para Nginx
# Ubicación de referencia: /etc/nginx/sites-available/polis
# Tarea: [CIERRE-04] Endurecimiento de Seguridad
# ==============================================================================
#
# IMPORTANTE:
# NO recargar Nginx en el servidor de producción sin autorización previa de 'agy'.
# Comando de validación de sintaxis:
#   sudo nginx -t
# Comando de aplicación (solo previa autorización):
#   sudo systemctl reload nginx
#
# ==============================================================================

# ------------------------------------------------------------------------------
# MODO 1: REPORT-ONLY (Fase de observación y auditoría de telemetría)
# Activar esta directiva para monitorear violaciones sin bloquear recursos legítimos:
# ------------------------------------------------------------------------------
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.tile.osm.org https://*.googleusercontent.com https://seguridadhumanaintegral.org https://www.seguridadhumanaintegral.org https://images.unsplash.com https://api.qrserver.com; font-src 'self' data:; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://seguridadhumanaintegral.org https://www.seguridadhumanaintegral.org https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://accounts.google.com ws: wss:; frame-src 'self' https://accounts.google.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# ------------------------------------------------------------------------------
# MODO 2: ENFORCE (Producción estricta - Mitigación activa XSS / Data Exfiltration)
# Esta directiva protege activamente los tokens de sesión en sessionStorage:
# ------------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.tile.osm.org https://*.googleusercontent.com https://seguridadhumanaintegral.org https://www.seguridadhumanaintegral.org https://images.unsplash.com https://api.qrserver.com; font-src 'self' data:; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://seguridadhumanaintegral.org https://www.seguridadhumanaintegral.org https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://accounts.google.com ws: wss:; frame-src 'self' https://accounts.google.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

# Cabeceras complementarias recomendadas para el bloque 'server' HTTPS en Nginx:
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
