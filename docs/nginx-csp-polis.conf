# ==============================================================================
# POLIS - Configuración de Content-Security-Policy (CSP) para Nginx
# Ubicación de referencia: /etc/nginx/sites-available/polis
# Tareas: [CIERRE-04] y [CIERRE-05] Endurecimiento y Telemetría CSP
# ==============================================================================
#
# IMPORTANTE:
# NO recargar Nginx en el servidor de producción sin autorización previa de 'agy'.
# Comando de validación de sintaxis:
#   sudo nginx -t
# Comando de aplicación (solo previa autorización):
#   sudo systemctl reload nginx
#
# ==============================================================================

# ------------------------------------------------------------------------------
# MODO 1: REPORT-ONLY (Modo por defecto en CIERRE-05: Observación y telemetría)
# Activa el reporte de incidentes sin bloquear recursos legítimos en el cliente.
# ------------------------------------------------------------------------------
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.tile.osm.org https://*.googleusercontent.com https://seguridadhumanaintegral.org https://www.seguridadhumanaintegral.org https://images.unsplash.com https://api.qrserver.com; font-src 'self' data:; connect-src 'self' https://seguridadhumanaintegral.org https://www.seguridadhumanaintegral.org https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://accounts.google.com; frame-src 'self' https://accounts.google.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/v1/seguridad/csp-report; report-to csp-endpoint;" always;

# ------------------------------------------------------------------------------
# MODO 2: ENFORCE (Producción estricta - Mitigación activa XSS / Exfiltración)
# Descomentar este bloque y comentar el de Report-Only cuando EAF lo autorice:
# ------------------------------------------------------------------------------
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://*.tile.osm.org https://*.googleusercontent.com https://seguridadhumanaintegral.org https://www.seguridadhumanaintegral.org https://images.unsplash.com https://api.qrserver.com; font-src 'self' data:; connect-src 'self' https://seguridadhumanaintegral.org https://www.seguridadhumanaintegral.org https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://accounts.google.com; frame-src 'self' https://accounts.google.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/v1/seguridad/csp-report; report-to csp-endpoint;" always;

# Reporting-Endpoints para navegadores modernos (Reporting API v1):
add_header Reporting-Endpoints 'csp-endpoint="/api/v1/seguridad/csp-report"' always;

# Cabeceras complementarias recomendadas para el bloque 'server' HTTPS en Nginx:
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

