name: polis

services:
  database:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: polis
      POSTGRES_USER: polis
      POSTGRES_PASSWORD: polis_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - polis_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polis -d polis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  polis_database:
